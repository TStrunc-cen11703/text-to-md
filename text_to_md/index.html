<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Převodník dokumentů na Markdown</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #1f2937;
      background: #f3f5f8;
    }

    body {
      max-width: 820px;
      margin: 0 auto;
      padding: 32px 20px;
    }

    main {
      padding: 28px;
      border: 1px solid #d8dee8;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 8px 28px #17203312;
    }

    h1 {
      margin-top: 0;
      font-size: 1.8rem;
    }

    .privacy-note {
      padding: 12px 14px;
      border-left: 4px solid #16804a;
      background: #edf8f1;
    }

    label, button {
      font: inherit;
    }

    label {
      display: block;
      margin: 22px 0 8px;
      font-weight: 600;
    }

    input[type="file"] {
      display: block;
      width: 100%;
      margin-bottom: 16px;
    }

    button {
      min-height: 42px;
      padding: 9px 16px;
      border: 0;
      border-radius: 6px;
      color: #fff;
      background: #155eef;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    button.secondary {
      color: #1f2937;
      background: #e8edf5;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 18px 0;
    }

    #status {
      min-height: 1.5em;
      margin: 16px 0;
    }

    #status[data-state="error"] {
      color: #b42318;
    }

    #status[data-state="success"] {
      color: #087443;
    }

    #warnings:empty {
      display: none;
    }

    #warnings {
      padding: 12px 14px 12px 34px;
      background: #fff8e6;
    }

    textarea {
      box-sizing: border-box;
      width: 100%;
      min-height: 320px;
      padding: 12px;
      border: 1px solid #c8d0dc;
      border-radius: 6px;
      font: 14px/1.5 Consolas, "Courier New", monospace;
      resize: vertical;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 520px) {
      body {
        padding: 16px 10px;
      }

      main {
        padding: 20px 16px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Převodník dokumentů na Markdown</h1>
    <p class="privacy-note">
      Dokument se zpracuje na tomto počítači, nikam mimo něj se neodesílá
      a aplikace jej po převodu neuchovává.
    </p>
    <p>Podporované soubory: Word (.docx), text (.txt) a textové PDF (.pdf). Limit je 20 MB.</p>

    <form id="convert-form">
      <label for="document">Vyberte dokument</label>
      <input
        id="document"
        name="file"
        type="file"
        accept=".docx,.txt,.pdf"
        required
      >
      <button id="convert-button" type="submit">Převést na Markdown</button>
    </form>

    <p id="status" role="status" aria-live="polite"></p>
    <ul id="warnings" aria-label="Upozornění při převodu"></ul>

    <section id="result" hidden>
      <h2>Výsledek: <span id="output-name"></span></h2>
      <div class="actions">
        <button id="download-button" type="button">Stáhnout soubor .md</button>
        <button id="copy-button" class="secondary" type="button">Kopírovat Markdown</button>
      </div>
      <label for="markdown-output">Náhled Markdownu</label>
      <textarea id="markdown-output" readonly spellcheck="false"></textarea>
    </section>
  </main>

  <script>
    const MAX_UPLOAD_BYTES = 20 * 1024 * 1024;
    const form = document.querySelector("#convert-form");
    const fileInput = document.querySelector("#document");
    const convertButton = document.querySelector("#convert-button");
    const status = document.querySelector("#status");
    const warnings = document.querySelector("#warnings");
    const result = document.querySelector("#result");
    const outputName = document.querySelector("#output-name");
    const markdownOutput = document.querySelector("#markdown-output");
    const downloadButton = document.querySelector("#download-button");
    const copyButton = document.querySelector("#copy-button");

    function setStatus(message, state = "") {
      status.textContent = message;
      status.dataset.state = state;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const file = fileInput.files[0];
      if (!file) {
        setStatus("Nejprve vyberte soubor.", "error");
        return;
      }
      if (file.size > MAX_UPLOAD_BYTES) {
        setStatus("Soubor překračuje limit 20 MB.", "error");
        return;
      }

      const formData = new FormData();
      formData.append("file", file);
      convertButton.disabled = true;
      result.hidden = true;
      warnings.replaceChildren();
      setStatus("Probíhá převod…");

      try {
        const response = await fetch("/convert", {
          method: "POST",
          body: formData,
        });
        const payload = await response.json();
        if (!response.ok) {
          const detail = typeof payload.detail === "string"
            ? payload.detail
            : "Soubor se nepodařilo převést.";
          throw new Error(detail);
        }

        outputName.textContent = payload.filename;
        markdownOutput.value = payload.markdown;
        for (const warning of payload.warnings) {
          const item = document.createElement("li");
          item.textContent = warning;
          warnings.append(item);
        }
        result.hidden = false;
        setStatus("Převod je hotový.", "success");
      } catch (error) {
        const message = error instanceof Error
          ? error.message
          : "Převod se nezdařil. Zkuste to prosím znovu.";
        setStatus(message, "error");
      } finally {
        convertButton.disabled = false;
      }
    });

    downloadButton.addEventListener("click", () => {
      const blob = new Blob([markdownOutput.value], {
        type: "text/markdown;charset=utf-8",
      });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = outputName.textContent;
      link.hidden = true;
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });

    copyButton.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(markdownOutput.value);
        setStatus("Markdown byl zkopírován do schránky.", "success");
      } catch {
        setStatus("Kopírování se nepodařilo. Označte text v náhledu a zkopírujte jej ručně.", "error");
      }
    });
  </script>
</body>
</html>
